<!DOCTYPE html>
<html>
<head>
    <title>Edit Booking</title>
</head>

<body>

    <h1>Edit Booking</h1>

    <form method="POST">

        <label>Name</label><br>
        <input
            type="text"
            name="name"
            value="{{ booking[1] }}"
            required
        >

        <br><br>

        <label>Mobile Number</label><br>
        <input
            type="tel"
            name="mobile"
            value="{{ booking[2] }}"
            required
        >

        <br><br>

        <label>Select Test</label><br>

        <select name="test" required>

            <option value="CBC"
                {% if booking[3] == "CBC" %}selected{% endif %}>
                CBC
            </option>

            <option value="Lipid Profile"
                {% if booking[3] == "Lipid Profile" %}selected{% endif %}>
                Lipid Profile
            </option>

            <option value="Liver Function Test"
                {% if booking[3] == "Liver Function Test" %}selected{% endif %}>
                Liver Function Test
            </option>

            <option value="Kidney Function Test"
                {% if booking[3] == "Kidney Function Test" %}selected{% endif %}>
                Kidney Function Test
            </option>

        </select>

        <br><br>

        <label>Preferred Date</label><br>

        <input
            type="date"
            name="date"
            value="{{ booking[4] }}"
            required
        >

        <br><br>

        <button type="submit">Update Booking</button>

    </form>

    <br>

    <a href="/admin">Cancel</a>

</body>
</html>
